# Render Blueprint for the JiaJia LINE bot.
# Render reads this file and creates the web service; secrets are asked for during setup.
services:
  - type: web
    name: jiajia-line-bot
    runtime: python
    plan: free
    rootDir: JiaJia_Line_OA
    buildCommand: pip install -r requirements.txt
    # One worker on purpose: chat history and "talk to admin" pauses live in memory.
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GEMINI_API_KEY
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
